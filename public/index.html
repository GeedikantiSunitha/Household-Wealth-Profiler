<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Household Wealth Profiler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><h1>Household Wealth Profiler</h1><span id="hhName">UK private wealth · CFA economic balance sheet</span></div>
  <div class="actions">
    <span class="who" id="who"></span>
    <span class="save" id="saveState" aria-live="polite"></span>
    <button class="btn" id="btnClients" type="button" hidden>All households</button>
    <button class="btn" id="btnImport" type="button">Import Excel / JSON</button>
    <input type="file" id="fileIn" accept=".xlsx,.xls,.json" hidden>
    <button class="btn" id="btnTemplate" type="button">Excel template</button>
    <button class="btn" id="btnExport" type="button">Export Excel</button>
    <button class="btn" id="btnJson" type="button">Export JSON</button>
    <span id="resetWrap"></span>
  </div>
</div></header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
