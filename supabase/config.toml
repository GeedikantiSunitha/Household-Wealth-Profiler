# Supabase CLI settings. Auth settings here are pushed to the hosted project with `supabase config push`.
project_id = "wealth-profiler"

[functions.api]
# The function verifies the user's token itself (supports the new JWT signing keys)
verify_jwt = false

[auth]
# Front-end address, taken from the APP_ORIGIN environment variable at `supabase config push`
site_url = "env(APP_ORIGIN)"
additional_redirect_urls = ["http://localhost:8081"]
# Firms are created by you; people join only by invitation from their firm administrator
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
